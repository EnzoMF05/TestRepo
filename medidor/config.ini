; ==========================================================================
;  Medidor de execucao (Etapa 2) - configuracao
;  Linhas comecadas por ";" sao comentarios. Depois de mudar algo, pare o
;  medidor (Ctrl+C) e volte a arranca-lo.
; ==========================================================================

[geral]
; Activos a medir, com o nome exacto da Hyperliquid (BTC, ETH, SOL, HYPE, kPEPE...).
ativos = BTC, ETH, SOL

; Endereco publico da conta (0x...), para medir o custo dos seus fills.
; E so o endereco: nenhuma chave. Deixe vazio para medir apenas mercado e sinais.
endereco =

; Pasta onde ficam todos os registos, relativa a este ficheiro.
pasta_dados = dados

; Dias de metricas de mercado a guardar (os registos de sinais e fills nunca se apagam).
guardar_dias = 30

[orcamento]
; G: alvo tipico dos seus trades, em bps (1 bp = 0,01 %). So quem opera o sabe; fica neste ficheiro.
alvo_bps = 30
; phi: fraccao do alvo que a entrada pode gastar em spread e impacto. B = phi x G.
fraccao_alvo = 0.15
; theta: fraccao do livro visivel que se assume estar la quando a ordem chegar.
desconto_livro = 0.5
; Tamanho de referencia de uma ordem, em dolares, para calcular o impacto.
tamanho_usd = 1000
; Taxas por lado no seu escalao, em bps, usadas no relatorio (a taxa real vem dos fills).
taxa_taker_bps = 4.5
taxa_maker_bps = 1.5
; Valor minimo de uma ordem na Hyperliquid, em dolares. O bilhete avisa se o tamanho,
; arredondado ao passo da bolsa, ficar abaixo disto.
minimo_ordem_usd = 10

[detector]
; Cada medida compara-se com o seu proprio historico destas horas.
janela_horas = 24
; Minutos de historico exigidos antes de dar estados (ate la mostra AQUECIMENTO).
aquecimento_min = 30
; Percentis de alarme.
percentil_amarelo = 80
percentil_vermelho = 95
; Pisos de relevancia: uma medida so da alarme se for rara (percentil) E passar o piso.
; Ponha 0 para desligar um piso.
piso_spread_bps = 1.0
; Profundidade so alarma se o livro util for menor do que este numero de vezes o tamanho_usd.
piso_profundidade_x = 20
piso_vol_razao = 1.5
piso_intensidade_razao = 2.0
; O fluxo de ordens (OFI) tem lado: serve para escolher a rota e fica registado em cada sinal,
; com o lado da ordem. Por defeito nao entra no estado do livro. Com "sim" volta a entrar,
; sem lado, e usa o piso abaixo.
fluxo_no_estado = nao
piso_ofi = 1.0
piso_liquidacoes_usd = 100000
piso_mark_oraculo_bps = 5.0

[sombra]
; T: segundos que a ordem passiva simulada espera antes de ser cancelada.
prazo_s = 30
; Horizontes, em segundos, em que se mede o resultado de cada sinal.
; Para trades de horas, acrescente a duracao tipica (por exemplo 3600 ou 14400).
horizontes_s = 5, 30, 60, 300
; h: horizonte usado na regra passiva/agressiva. A 300 s mede a qualidade da entrada,
; nao o resultado do trade. Para comparar as rotas a escala do trade, ponha aqui a sua duracao.
horizonte_regra_s = 300
; Horizontes em que se mede a seleccao adversa de cada fill.
horizontes_fill_s = 5, 30, 60
; Um fill de abertura liga-se ao sinal do mesmo activo e lado dado ha menos de estes segundos.
janela_sinal_s = 900
; A regra 6.5 compara V passiva com V agressiva. Com "nao", basta a passiva valer mais (aos 100 sinais).
; Com "sim", so tira a travessia se a diferenca passar 2 erros padrao; o relatorio e o bilhete mostram-na.
regra_exige_margem = nao

[painel]
; De quantos em quantos segundos o painel e escrito no ecra.
intervalo_s = 5

[coinglass]
; Opcional. Com a chave da API, o detector ganha a medida de liquidacoes.
; Professional (e Standard) incluem o fluxo de ordens de liquidacao. O heatmap nao entra:
; e uma imagem, e o detector precisa do fluxo.
chave =
canal = liquidation_orders
; Se o websocket vier vazio, o medidor pede o mesmo fluxo no REST v4 (cabecalho CG-API-KEY).
rest = sim
rest_exchanges = Binance, OKX, Bybit
rest_min_usd = 10000
rest_intervalo_s = 10
