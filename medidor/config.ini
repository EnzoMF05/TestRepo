; ==========================================================================
;  Medidor de execucao (Etapa 2) - configuracao
;  Linhas comecadas por ";" sao comentarios. Depois de mudar algo, pare o
;  medidor (Ctrl+C) e volte a arranca-lo.
; ==========================================================================

[geral]
; Activos a medir, com o nome exacto da Hyperliquid (BTC, ETH, SOL, HYPE, kPEPE...).
ativos = BTC, ETH, SOL

; Endereco publico da conta (0x...), para medir o custo dos seus fills.
; E so o endereco: nenhuma chave. Deixe vazio para medir apenas mercado e sinais.
endereco =

; Pasta onde ficam todos os registos, relativa a este ficheiro.
pasta_dados = dados

; Dias de metricas de mercado a guardar (os registos de sinais e fills nunca se apagam).
guardar_dias = 30

[orcamento]
; G: alvo tipico dos seus trades, em bps (1 bp = 0,01 %). So quem opera o sabe; fica neste ficheiro.
alvo_bps = 30
; phi: fraccao do alvo que a entrada pode gastar em spread e impacto. B = phi x G.
fraccao_alvo = 0.15
; theta: fraccao do livro visivel que se assume estar la quando a ordem chegar.
desconto_livro = 0.5
; Tamanho de referencia de uma ordem, em dolares, para calcular o impacto.
tamanho_usd = 1000
; Taxas por lado no seu escalao, em bps, usadas no relatorio (a taxa real vem dos fills).
taxa_taker_bps = 4.5
taxa_maker_bps = 1.5
; Valor minimo de uma ordem na Hyperliquid, em dolares. O bilhete avisa se o tamanho,
; arredondado ao passo da bolsa, ficar abaixo disto.
minimo_ordem_usd = 10

[detector]
; Cada medida compara-se com o seu proprio historico destas horas.
janela_horas = 24
; Minutos de historico exigidos antes de dar estados (ate la mostra AQUECIMENTO).
aquecimento_min = 30
; Percentis de alarme.
percentil_amarelo = 80
percentil_vermelho = 95
; Pisos de relevancia: uma medida so da alarme se for rara (percentil) E passar o piso.
; Ponha 0 para desligar um piso.
piso_spread_bps = 1.0
; Profundidade so alarma se o livro util for menor do que este numero de vezes o tamanho_usd.
piso_profundidade_x = 20
piso_vol_razao = 1.5
piso_intensidade_razao = 2.0
; O fluxo de ordens (OFI) tem lado: serve para escolher a rota e fica registado em cada sinal,
; com o lado da ordem. Por defeito nao entra no estado do livro. Com "sim" volta a entrar,
; sem lado, e usa o piso abaixo.
fluxo_no_estado = nao
piso_ofi = 1.0
piso_liquidacoes_usd = 100000
piso_mark_oraculo_bps = 5.0

[sombra]
; T: segundos que a ordem passiva simulada espera antes de ser cancelada.
prazo_s = 30
; Horizontes, em segundos, em que se mede o resultado de cada sinal.
; O sinalizador precisa de 900, 3600 e 14400 (a escala do trade) e avisa se faltarem;
; 300 mede a qualidade da entrada, nao o resultado do trade.
horizontes_s = 5, 30, 60, 300, 900, 3600, 14400
; h: horizonte usado na regra passiva/agressiva. A 300 s mede a qualidade da entrada,
; nao o resultado do trade; a 3600 s compara as rotas a escala do trade do sinalizador.
horizonte_regra_s = 3600
; Horizontes em que se mede a seleccao adversa de cada fill.
horizontes_fill_s = 5, 30, 60
; Um fill de abertura liga-se ao sinal do mesmo activo e lado dado ha menos de estes segundos.
janela_sinal_s = 900
; A regra 6.5 compara V passiva com V agressiva. Com "nao", basta a passiva valer mais (aos 100 sinais).
; Com "sim", so tira a travessia se a diferenca passar 2 erros padrao; o relatorio e o bilhete mostram-na.
regra_exige_margem = nao

[painel]
; De quantos em quantos segundos o painel e escrito no ecra.
intervalo_s = 5

[coinglass]
; Opcional. Com a chave da API, o detector ganha a medida de liquidacoes.
; Professional (e Standard) incluem o fluxo de ordens de liquidacao. O heatmap nao entra:
; e uma imagem, e o detector precisa do fluxo.
chave =
canal = liquidation_orders
; Se o websocket vier vazio, o medidor pede o mesmo fluxo no REST v4 (cabecalho CG-API-KEY).
rest = sim
rest_exchanges = Binance, OKX, Bybit
rest_min_usd = 10000
rest_intervalo_s = 10

[sinalizador]
; Sinalizador de reversao (Etapa 1, REVOU v2). O medidor ignora esta seccao.
; Cada alteracao a um parametro conta como ensaio (dados/ensaios.csv).

; --- Ancora e ajuste AR(1) (velas de 1 h) ---
; h_A: meia-vida da ancora exponencial. Tem de ser >= 4 x h_max para rho ficar acima de 0,75.
h_a = 96
; N de referencia do AR(1) (30 dias; IC da meia-vida com cerca de 35 % de largura). A janela
; efectiva e N = min(n_max, velas de 1 h fechadas depois do aquecimento da ancora), igual ao vivo e
; no backtest: esta chave entra na variante (hash) e na sigma do nulo GBM, nao altera N.
n_ajuste = 720
; Janela minima para o ajuste ser valido (20 dias; abaixo o teste nao tem potencia).
n_min = 480
; Janela maxima, atingida a medida que o historico em disco cresce (90 dias).
n_max = 2160

; --- Teste da nula (phi = lambda_A) ---
; Calibrar t_crit por simulacao do passeio aleatorio no arranque; "nao" usa t_nulo_max.
calibrar_nula = sim
; Nivel do quantil de t_crit (0,001 equivale ao -3 de Harvey, Liu e Zhu numa normal).
alpha_nula = 0.001
; Replicas da simulacao (menos de 2 s por activo).
replicas_nula = 1000
; Semente de random.Random na calibracao: determinismo bit a bit.
semente_nula = 7
; Limiar de t_nulo quando a calibracao esta desligada.
t_nulo_max = -3.0
; Fronteira do estado AMARELO (regista-se o que fica entre t_amarelo e t_crit, sem sinalizar).
t_amarelo = -2.0

; --- Racio de variancias (veto de tendencia) ---
; q: horizonte do racio de variancias, em velas de 1 h (uma meia-vida tipica).
q_vr = 8
; VR(q) tem de ficar abaixo disto para o contexto ser VERDE.
vr_max_verde = 1.0
; VR(q) acima disto, com z* acima de zvr_veto, veta (tendencia clara).
vr_veto = 1.2
; z* robusto minimo para o veto de tendencia (5 % unilateral).
zvr_veto = 2.0

; --- Meia-vida util (velas de 1 h) ---
; Abaixo de h_min e microestrutura e ressalto bid-ask.
h_min = 3
; Acima de h_max e mais lento do que o horizonte de 16 h.
h_max = 24

; --- Volatilidade de 15 m (Parkinson) ---
; Meia-vida curta da EWMA de Parkinson, em velas de 15 m (2 h).
h_vc = 8
; Meia-vida longa, em velas de 15 m (1 dia).
h_vl = 96
; Maximo de sigma_curta/sigma_longa; acima e regime de cascata.
vol_razao_max = 2.0
; Multiplo de sigma_15 acima do qual a vela de reentrada conta como choque (G5).
k_choque = 4
; Desvios padrao do retorno do dia (desde as 00:00 UTC) que vetam; 0 desliga.
k_dia = 2

; --- Bandas (em sigma de equilibrio) ---
; Banda de entrada: P(|z| > 2) = 4,6 % das velas sob OU gaussiano.
z_in = 2.0
; Banda de saida: a ultima meia sigma e lenta e dominada por microestrutura.
z_out = 0.5
; Banda do stop (cerca de 1,1 sigma da entrada; G/L perto de 1,2).
z_stop = 3.0
; Extensao maxima da excursao; acima e quebra de regime, nao oportunidade.
z_veto = 4.0
; Janela rolante do quantil empirico 0,954 de |z| (30 dias; sem a vela corrente).
n_z = 720
; Se o quantil empirico passar isto, a banda de entrada alarga para o quantil.
z_in_emp_max = 2.5

; --- Gatilho ---
; Caminho minimo ate z_out, em sigma, para G pagar os custos (G3).
z_min_resto = 0.75
; Duracao maxima da excursao em pares de meias-vidas: k_max = 8 x k_h x H velas de 15 m.
k_h = 1
; Tecto de k_max em velas de 15 m (16 h).
k_max_tecto = 64
; Tempo maximo do trade em meias-vidas (75 % do caminho esperado).
n_h = 2
; Tecto do tempo maximo em horas (acima sai do horizonte 14400 do medidor).
tmax_h = 16
; Invalidacao (60): a ancora reestimada moveu o alvo mais do que isto, em sigma_0, contra o trade.
desloc_alvo_max = 0.5

; --- Fechos e atraso (G0) ---
; Folga apos T, em ms, para declarar a vela fechada pelo relogio corrigido.
folga_fecho_ms = 1500
; Atraso local menos bolsa maximo, em ms, para avaliar o fecho.
atraso_max_ms = 3000
; Idade maxima do contexto de 1 h, em minutos (mais do que isto e um fecho perdido).
idade_ctx_max_min = 75

; --- Rajadas de liquidacao e TWAP (canal trades) ---
; Intervalo maximo, em ms, entre negocios do mesmo agressor num bloco.
rajada_dt_ms = 1000
; Amplitude minima de preco dentro do bloco, em bps, para contar como rajada.
rajada_amp_bps = 2
; Segundos sem rajada contraria antes de entrar (dois arrefecimentos de 30 s).
rajada_silencio_s = 60
; Negocios minimos do mesmo agressor para detectar um TWAP.
twap_min_negocios = 4
; Janela de deteccao do TWAP, em segundos.
twap_janela_s = 600
; Intervalo minimo e maximo entre fatias, em segundos (modo aleatorio da Hyperliquid).
twap_dt_min_s = 10
twap_dt_max_s = 50
; So negocios com hash a zeros contam para o TWAP (H5); "nao" usa so a cadencia (twapsrc=cad).
twap_usar_hash = sim
; Lado do negocio pelo tick (px >= ultimo preco = compra) quando H2 falha no comando verificar.
lado_por_tick = nao

; --- Negocios grandes e tacticas das baleias (T1 a T8) ---
; Quantil do notional em 24 h que define negocio grande (relativo ao proprio activo).
q_grande = 0.99
; Amostras do JanelaPercentil do notional (cobre 24 h de negocios em BTC).
n_grandes_max = 20000
; |FLX_1h| minimo para T1.
limiar_flx = 0.3
; |REP_1h| minimo para T2 (enderecos insistentes liquidos).
limiar_rep = 2
; |z_F| minimo para T3 (um MAD de funding).
limiar_fz = 1.0
; liq_k abaixo disto conta cascata esgotada (T4); -1 acima de liq_alto.
limiar_liq = 0.5
; liq_k acima disto conta -1 em T4 (cascata ainda a decorrer).
liq_alto = 0.8
; Residuo padronizado minimo da regressao fluxo-preco para T7.
limiar_abs = 1.0
; Distancia ao liquidationPx que conta como combustivel; FUEL/OI acima disto reduz f_B a fb_baixo.
pct_fuel = 0.02
; Percentil alto de FLX e dPOS (T1, T5).
pos_alto = 0.8
; Percentil baixo de dOI8 para T8 (0 ate haver 960 valores).
pos_baixo = 0.1
; B_k igual ou abaixo disto veta a entrada (o unico bloqueio por baleias).
b_veto = -2
; f_B com B_k <= 0.
fb_baixo = 0.5
; f_B com B_k >= b_alto; nunca acima de 1,25.
fb_alto = 1.25
; B_k a partir do qual f_B = fb_alto.
b_alto = 3

; --- Lista e sonda de baleias ---
; HLP e cofre liquidador, separados por ";": excluidos de REP, da lista e da sonda
; (confirmados por vaultDetails no comando verificar). Sao enderecos publicos de cofres.
enderecos_excluidos = 0xdfc24b077bc1425ad1dea75bcb6f8158e10df303;0x2e3d94f0562703b25c83308a05046ddaf9a8dd14
; Enderecos sondados por clearinghouseState (200 de peso por 15 min).
baleias_max = 100
; Cadencia da sonda de posicoes, em segundos (uma vez por vela de 15 m).
sonda_s = 900
; accountValue minimo, em dolares, para entrar na lista.
baleia_valor_min_usd = 1e6
; vlm_month/accountValue maximo (exclui market makers por rotacao).
baleia_vlm_racio_max = 50
; |N_24|/G_24 minimo nos negocios (quem compra e vende por igual nao da direccao).
baleia_direcc_min = 0.30
; Dias sem liquidacao exigidos (exclui martingales recem-liquidados).
baleia_liq_dias = 7

; --- Capital e tamanho ---
; E: capital de referencia em dolares. So quem opera o sabe; fica neste ficheiro.
capital_usd = 20000
; Fraccao de Kelly (44 % do crescimento maximo com 6 % da variancia).
k_kelly = 0.25
; Fraccao do capital perdida num stop, custos incluidos.
risco_por_trade = 0.005
; Volatilidade diaria do capital por posicao.
vol_alvo_dia = 0.01
; Fraccao do volume medio de uma vela de 15 m (tecto de liquidez proprio).
liq_fraccao = 0.01
; Tamanho em fase de calibracao, em dolares (o tamanho de referencia do medidor).
tamanho_base = 1000
; Tecto por sinal em fraccao de E.
tamanho_max_frac = 0.25
; Soma dos tamanhos abertos em fraccao de E.
expo_max = 0.75
; Trades virtuais fechados antes de sair da fase de calibracao.
n_cal = 30
; Margem minima de p_inf sobre p*.
m_min = 0.05
; G minimo em multiplos de c_L (com c_L = 13 exige G >= 39 bps).
g_min_x_custo = 3

; --- Custos de defeito (substituidos pelos medidos com 30 aberturas) ---
; Taxa taker de defeito, em bps.
custo_taxa_entrada_bps = 4.5
; Impacto de defeito por lado, em bps (substituido por imp_ref_bps do medidor).
imp_defeito_bps = 2
; Custo de um trade ganho sem funding, em bps (4,5 + 2 + 1,5).
c_w_bps = 8
; Custo de um trade perdido sem funding, em bps (4,5 + 2 + 4,5 + 2).
c_l_bps = 13

; --- Disjuntores (param a emissao; nunca fecham o trade virtual) ---
; Disjuntor diario em multiplos da mediana de G.
perdas_dia_x_g = 3
; Stops consecutivos que param o activo ate ao proximo fecho de 1 h VERDE.
perdas_seguidas = 5
; CVaR dos 5 % piores em multiplos da mediana de L; para tudo ate "sinalizador.py reset".
cvar_x_l = 2
; Velas de 15 m sem nova entrada apos um stop.
arrefecimento_velas = 2
; Sessoes desligadas (asia, europa, eua, fds), separadas por virgula. Vazio = nenhuma.
; So apos o relatorio mostrar expectancia negativa com 2 erros padrao numa sessao.
veto_sessao =

; --- Ficheiros e fontes ---
; Pasta das velas e colunas enriquecidas, relativa a este ficheiro (nunca a do medidor).
pasta_velas = dados/velas
; Fonte da lista de baleias sem chave (nao documentada; so se muda para a simulacao).
url_leaderboard = https://stats-data.hyperliquid.xyz/Mainnet/leaderboard
